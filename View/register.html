<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/img/icon-to-do-list.png" />
    <link rel="stylesheet" href="../assets/register.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>To Do | DSW1</title>
</head>
<body>
    <div class="general-wrapper">
        <div class="signin-text-wrapper">
            <h1>Create account</h1>
            <h2>Join us and organize your tasks</h2>
        </div>

        <form action="../Controller/registration.php" method="post">
            <div class="input-container">
                <label for="username">
                    <input
                        id="username"
                        placeholder="Username"
                        name="username"
                        type="text"
                        required
                    />
                </label>

                <label for="email">
                    <input
                        id="email"
                        placeholder="Email"
                        name="email"
                        type="email"
                        required
                    />
                </label>

                <label for="birthdate">
                    <input
                        id="birthdate"
                        name="birthdate"
                        type="date"
                        required
                    />
                </label>

                <label for="password" class="password-container">
                    <input
                        id="password"
                        placeholder="Password"
                        name="password"
                        type="password"
                        required
                    />
                    <i class="bi bi-eye-fill" id="togglePassword"></i>
                </label>
            </div>

            <div class="button-container">
                <label class="submit-button-container">
                    <button type="submit">REGISTER</button>
                </label>

                <h2>
                    Already have an account?
                    <a href="../View/login.html">Login now</a>
                </h2>
            </div>
        </form>
    </div>

    <script>
        const passwordField = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');

        togglePassword.addEventListener('click', function() {
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleButton.textContent = 'Hide'
            } else {
                passwordField.type = 'password';
                toggleButton.textContent = 'Show'
            }
        })

      // This function reads the URLs query string (after '?')
      function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
      }

      window.onload = function() {
        const error = getQueryParam('error'); // Get the 'error'

        // Comparison sequence
        if(error) {
          let message = "";
          if(error === 'userexists') {
            message = "Ooops! This username as alredy taken.";
          }else if(error === 'invalidrequest') {
            message = "Ooops! Invalid request."
          }else {
            message = "An unknown error occurred."
          }

          alert(message);
        }
      }
    </script>
</body>
</html>
